name: Build unsigned debug APK

# CI exists to prove the project still compiles for other people. It
# deliberately produces a DEBUG apk, not a release one:
#
#   - The signing key is private and not available to Actions, so a release
#     build here could never be signed anyway.
#   - A debug APK proves the code compiles, which is all CI is for.
#
# The downloadable signed APK for end users lives on the Releases page and is
# built on the maintainer's machine. Do not wire release signing into Actions
# without reading the 'Signing' section of README.md first -- if the key ever
# reaches a public CI log, it has to be considered compromised and rotated.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Generate the wrapper rather than committing it, so the checked-in
      # Gradle version can never drift from what CI actually used.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      # compileDebugKotlin fails the build on any Kotlin error. Cheaper than a
      # full APK build and catches everything that matters for a compile check.
      - name: Compile Kotlin sources
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: escalation-loot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error