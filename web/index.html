<body>

<canvas id="bgScene" aria-hidden="true"></canvas>
<div class="bg-scrim" aria-hidden="true"></div>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="64" y2="64">
          <stop offset="0" stop-color="#FFD54F"/><stop offset="1" stop-color="#FF8F00"/>
        </linearGradient></defs>
        <path d="M20 18h24l-4 26a8 8 0 0 1-8 6 8 8 0 0 1-8-6z" fill="#0E1116"/>

      </svg>
      <div class="brand-text">
        <h1 id="title">Escalation Loot</h1>
        <p id="subtitle">Division 2 Target Loot</p>
      </div>
    </div>
    <div class="actions">
      <button id="lang" class="btn ghost" type="button">中文</button>
      <button id="refresh" class="btn primary" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <section class="status-card">
      <div class="status-line">
        <span id="status" class="status-text">Loading…</span>
        <span id="freshness" class="freshness" hidden></span>
      </div>
      <div class="date-row">
        <span id="todayBadge" class="today-badge" hidden>TODAY</span>
        <span id="dateRow" class="date"></span>
        <span id="updated" class="updated"></span>
      </div>
      <div id="countdown" class="countdown" aria-live="off">—</div>
    </section>

    <section id="vendor" class="vendor" hidden>
      <div class="vendor-title" id="vendorTitle">Vendor caches</div>
      <div class="vendor-chips" id="vendorChips"></div>
    </section>

    <section id="grid" class="grid" aria-label="Escalation targets"></section>

    <section id="empty" class="empty" hidden>
      <div class="empty-icon">🎯</div>
      <div class="empty-title" id="emptyTitle">No target loot yet</div>
      <div class="empty-hint" id="emptyHint">Tap Refresh to fetch the latest escalation targets.</div>
    </section>

    <p id="problem" class="problem" hidden></p>
  </main>

  <footer class="footer">
